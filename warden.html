
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelCare Warden Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b1120;
      color: white;
      font-family: Arial, sans-serif;
      padding: 18px;
    }

    header {
      background: #172033;
      padding: 20px;
      border: 1px solid #263449;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    header h1 {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    header p {
      color: #94a3b8;
      font-size: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .stat {
      background: #172033;
      border: 1px solid #263449;
      padding: 15px 8px;
      border-radius: 12px;
      text-align: center;
    }

    .stat p {
      color: #94a3b8;
      font-size: 12px;
    }

    .stat h2 {
      color: #38bdf8;
      margin-top: 10px;
    }

    .panel {
      background: #172033;
      border: 1px solid #263449;
      padding: 18px;
      border-radius: 15px;
    }

    .panel h2 {
      color: #38bdf8;
      margin-bottom: 18px;
    }

    .complaint {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      overflow-wrap: anywhere;
    }

    .complaint h3 {
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .complaint p {
      color: #cbd5e1;
      margin-bottom: 9px;
      font-size: 14px;
    }

    .complaint img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      margin-top: 10px;
    }

    .complaint select {
      width: 100%;
      padding: 12px;
      background: #172033;
      color: white;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      margin-top: 10px;
    }

    .empty {
      color: #94a3b8;
      text-align: center;
      padding: 20px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    @media (max-width: 380px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🛡️ HostelCare</h1>
  <p>Warden Dashboard</p>
  <p>CMS College of Engineering and Technology</p>
</header>

<section class="stats">
  <div class="stat">
    <p>Total</p>
    <h2 id="total">0</h2>
  </div>

  <div class="stat">
    <p>Pending</p>
    <h2 id="pending">0</h2>
  </div>

  <div class="stat">
    <p>Resolved</p>
    <h2 id="resolved">0</h2>
  </div>
</section>

<section class="panel">
  <h2>📋 Student Complaints</h2>
  <div style="margin-bottom:15px;">
  <label for="statusFilter">Filter Complaints:</label>
  <select id="statusFilter" onchange="renderComplaints()"
    style="width:100%; padding:12px; margin-top:8px; background:#172033; color:white; border:1px solid #38bdf8; border-radius:8px;">
    <option value="All">All Complaints</option>
    <option value="Pending">Pending</option>
    <option value="In Progress">In Progress</option>
    <option value="Resolved">Resolved</option>
  </select>
  </div>
  <div id="complaintList">
    <p class="empty">No complaints yet.</p>
  </div>
</section>

<button onclick="logout()">Logout</button>

<script>
  const STORAGE_KEY = "hostelCareComplaints";

  function getComplaints() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      const data = saved ? JSON.parse(saved) : [];
      return Array.isArray(data) ? data : [];
    } catch (error) {
      alert("Unable to load complaints.");
      return [];
    }
  }

  function saveComplaints(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (error) {
      alert("Unable to save status. Please try again.");
      return false;
    }
  }

  function updateStatus(id, newStatus) {
    const complaints = getComplaints();
    const index = complaints.findIndex(c => c.id === id);

    if (index === -1) return;

    const oldStatus = complaints[index].status;
    complaints[index].status = newStatus;

    if (!saveComplaints(complaints)) {
      complaints[index].status = oldStatus;
      renderComplaints();
      return;
    }

    renderComplaints();
  }

  function renderComplaints() {
    const complaints = getComplaints();
    const list = document.getElementById("complaintList");

    document.getElementById("total").textContent = complaints.length;
    document.getElementById("pending").textContent =
      complaints.filter(c => c.status === "Pending").length;
    document.getElementById("resolved").textContent =
      complaints.filter(c => c.status === "Resolved").length;

    list.innerHTML = "";

    if (complaints.length === 0) {
      list.innerHTML = '<p class="empty">No complaints yet.</p>';
      return;
    }

    complaints.forEach(c => {
      const card = document.createElement("div");
      card.className = "complaint";

      const title = document.createElement("h3");
      title.textContent = c.category || "Complaint";
      card.appendChild(title);

      const fields = [
        "Complaint ID: " + c.id,
        "Student: " + c.name,
        "Room: " + c.room,
        "Hostel: " + c.hostel,
        "Problem: " + c.description,
        "Date: " + c.date,
        "Time: " + c.time
      ];

      fields.forEach(value => {
        const p = document.createElement("p");
        p.textContent = value;
        card.appendChild(p);
      });

      const statusLabel = document.createElement("p");
      statusLabel.textContent = "Current Status: " + c.status;
      card.appendChild(statusLabel);

      const select = document.createElement("select");

      ["Pending", "In Progress", "Resolved"].forEach(status => {
        const option = document.createElement("option");
        option.value = status;
        option.textContent = status;
        if (status === c.status) option.selected = true;
        select.appendChild(option);
      });

      select.addEventListener("change", function() {
        updateStatus(c.id, this.value);
      });

      card.appendChild(select);

      if (c.photo) {
        const img = document.createElement("img");
        img.src = c.photo;
        img.alt = "Complaint photo";
        card.appendChild(img);
      }

      list.appendChild(card);
    });
  }

  function logout() {
    window.location.href = "login.html";
  }

  renderComplaints();
</script>

</body>
</html>
