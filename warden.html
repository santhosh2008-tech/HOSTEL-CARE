
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080c">
  <title>HostelCare | Warden Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(circle at top, #35101c, transparent 45%),
        linear-gradient(145deg, #08080c, #16080e, #08080c);
      color: white;
      font-family: Arial, sans-serif;
      padding: 18px;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(145deg, #25121a, #100d13);
      padding: 24px;
      border: 1px solid #ff294f55;
      border-radius: 18px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px #ff294f18;
    }

    header h1 {
      color: #ff4969;
      margin-bottom: 8px;
      font-size: 27px;
    }

    header p {
      color: #aaa3ad;
      font-size: 13px;
      margin-top: 7px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .stat {
      background: linear-gradient(145deg, #251820, #100d13);
      border: 1px solid #ff294f40;
      padding: 20px 8px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 8px 20px #00000050;
      transition: 0.3s ease;
    }

    .stat:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px #ff294f25;
    }

    .stat p {
      color: #aaa3ad;
      font-size: 12px;
    }

    .stat h2 {
      color: #ff4969;
      margin-top: 12px;
      font-size: 27px;
    }

    .panel {
      background: linear-gradient(145deg, #1c1820, #100d13);
      border: 1px solid #ffffff18;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 10px 30px #00000060;
    }

    .panel h2 {
      color: #ff4969;
      margin-bottom: 20px;
      font-size: 21px;
    }

    label {
      color: #ddd3db;
      font-size: 14px;
    }

    .complaint {
      background: linear-gradient(145deg, #251820, #110d13);
      border: 1px solid #ff294f40;
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
      box-shadow: 0 7px 18px #00000040;
      transition: 0.3s ease;
    }

    .complaint:hover {
      border-color: #ff4969;
      transform: translateY(-3px);
    }

    .complaint h3 {
      color: #ff4969;
      margin-bottom: 14px;
      font-size: 18px;
    }

    .complaint p {
      color: #d1c8d0;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .complaint img {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      background: #08080c;
    }

    .complaint select,
    #statusFilter {
      width: 100%;
      padding: 13px;
      background: #100d13;
      color: white;
      border: 1px solid #ff294f80;
      border-radius: 9px;
      margin-top: 10px;
      font-size: 14px;
      outline: none;
    }

    select:focus {
      border-color: #ff4969;
      box-shadow: 0 0 10px #ff294f30;
    }

    select option {
      background: #100d13;
      color: white;
    }

    .empty {
      color: #aaa3ad;
      text-align: center;
      padding: 25px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: linear-gradient(135deg, #ff294f, #b9002c);
      color: white;
      border: 1px solid #ff5572;
      border-radius: 11px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 5px 18px #ff294f40;
      transition: 0.3s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px #ff294f70;
    }

    button:active {
      transform: scale(0.97);
    }

    footer {
      color: #716975;
      text-align: center;
      font-size: 12px;
      margin-top: 25px;
      padding: 15px;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .stat {
        padding: 16px 4px;
      }

      .stat p {
        font-size: 11px;
      }

      .stat h2 {
        font-size: 23px;
      }

      .panel {
        padding: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🛡️ HostelCare</h1>
  <p>Warden Dashboard</p>
  <p>CMS College of Engineering and Technology</p>
</header>

<section class="stats">

  <div class="stat">
    <p>Total</p>
    <h2 id="total">0</h2>
  </div>

  <div class="stat">
    <p>Pending</p>
    <h2 id="pending">0</h2>
  </div>
  
  <div class="stat">
  <p>In Progress</p>
  <h2 id="inProgress">0</h2>
  </div>
  
  <div class="stat">
    <p>Resolved</p>
    <h2 id="resolved">0</h2>
  </div>

</section>

<section class="panel">

  <h2>📋 Student Complaints</h2>

  <div style="margin-bottom:18px;">
    <label for="statusFilter">Filter Complaints:</label>

    <select id="statusFilter" onchange="renderComplaints()">
      <option value="All">All Complaints</option>
      <option value="Pending">Pending</option>
      <option value="In Progress">In Progress</option>
      <option value="Resolved">Resolved</option>
    </select>
  </div>

  <div id="complaintList">
    <p class="empty">No complaints yet.</p>
  </div>

</section>

<button type="button" onclick="logout()">↩ Logout</button>

<footer>
  HostelCare © 2026 | Warden Dashboard
</footer>

<script>
  const STORAGE_KEY = "hostelCareComplaints";

  function getComplaints() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      const data = saved ? JSON.parse(saved) : [];
      return Array.isArray(data) ? data : [];
    } catch (error) {
      alert("Unable to load complaints.");
      return [];
    }
  }

  function saveComplaints(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (error) {
      alert("Unable to save status. Please try again.");
      return false;
    }
  }

  function updateStatus(id, newStatus) {
    const complaints = getComplaints();
    const index = complaints.findIndex(c => c.id === id);

    if (index === -1) return;

    const oldStatus = complaints[index].status;
    complaints[index].status = newStatus;

    if (!saveComplaints(complaints)) {
      complaints[index].status = oldStatus;
      renderComplaints();
      return;
    }

    renderComplaints();
  }

  function renderComplaints() {
    const complaints = getComplaints();
    const list = document.getElementById("complaintList");

    document.getElementById("total").textContent = complaints.length;

    document.getElementById("pending").textContent =
      complaints.filter(c => c.status === "Pending").length;

    document.getElementById("resolved").textContent =
      complaints.filter(c => c.status === "Resolved").length;

    list.innerHTML = "";

    if (complaints.length === 0) {
      list.innerHTML = '<p class="empty">No complaints yet.</p>';
      return;
    }

    const filter = document.getElementById("statusFilter").value;

    const filteredComplaints = filter === "All"
      ? complaints
      : complaints.filter(c => c.status === filter);

    if (filteredComplaints.length === 0) {
      list.innerHTML =
        '<p class="empty">No complaints in this category.</p>';
      return;
    }

    filteredComplaints.forEach(c => {
      const card = document.createElement("div");
      card.className = "complaint";

      const title = document.createElement("h3");
      title.textContent = c.category || "Complaint";
      card.appendChild(title);

      const fields = [
        "Complaint ID: " + c.id,
        "Student: " + c.name,
        "Room: " + c.room,
        "Hostel: " + c.hostel,
        "Problem: " + c.description,
        "Date: " + c.date,
        "Time: " + c.time
      ];

      fields.forEach(value => {
        const p = document.createElement("p");
        p.textContent = value;
        card.appendChild(p);
      });

      const statusLabel = document.createElement("p");
      statusLabel.textContent = "Current Status: " + c.status;
      card.appendChild(statusLabel);

      const select = document.createElement("select");

      ["Pending", "In Progress", "Resolved"].forEach(status => {
        const option = document.createElement("option");
        option.value = status;
        option.textContent = status;

        if (status === c.status) {
          option.selected = true;
        }

        select.appendChild(option);
      });

      select.addEventListener("change", function() {
        updateStatus(c.id, this.value);
      });

      card.appendChild(select);

      if (c.photo) {
        const img = document.createElement("img");
        img.src = c.photo;
        img.alt = "Complaint photo";
        card.appendChild(img);
      }

      list.appendChild(card);
    });
  }

  function logout() {
    window.location.href = "index.html";
  }

  renderComplaints();
</script>

</body>
</html>
