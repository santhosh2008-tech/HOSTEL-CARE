
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080c">
  <title>HostelCare | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 18px;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #36101c, transparent 45%),
        linear-gradient(145deg, #08080c, #16080e, #08080c);
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 85px;
      height: 85px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 15px;
      font-size: 43px;
      border-radius: 25px;
      background: linear-gradient(145deg, #ff294f, #a50025);
      box-shadow: 0 0 30px #ff294f66;
      transform: perspective(500px) rotateX(8deg);
    }

    h1 {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ff294f, #ff8197);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa3ad;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #1c1820, #100d13);
      border: 1px solid #ffffff18;
      border-radius: 20px;
      padding: 27px 23px;
      margin-bottom: 20px;
      text-align: left;
      box-shadow:
        0 12px 30px #00000070,
        inset 0 1px 0 #ffffff12;
      transition: 0.35s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff294f, transparent);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #ff294f88;
      box-shadow: 0 15px 35px #ff294f20;
    }

    .card h2 {
      color: #ff4969;
      font-size: 21px;
      margin-bottom: 10px;
    }

    .card p {
      color: #aaa3ad;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 1px solid #ff5572;
      border-radius: 11px;
      background: linear-gradient(135deg, #ff294f, #b9002c);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 18px #ff294f40;
      transition: 0.3s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px #ff294f70;
      background: linear-gradient(135deg, #ff4969, #d00035);
    }

    button:active {
      transform: scale(0.97);
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      background: #09080d;
      color: white;
      border: 1px solid #49303a;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #ff294f;
      box-shadow: 0 0 12px #ff294f35;
    }

    #wardenBox {
      display: none;
      margin-top: 20px;
      animation: appear 0.4s ease;
    }

    #message {
      color: #ff637c;
      font-size: 13px;
      margin-top: 12px;
      line-height: 1.5;
    }

    footer {
      color: #716975;
      font-size: 12px;
      margin-top: 28px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 30px;
      }

      .card {
        padding: 23px 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">🏠</div>

  <h1>HostelCare</h1>

  <p class="subtitle">
    CMS College of Engineering and Technology<br>
    Hostel Complaint Management System
  </p>

  <div class="card">
    <h2>🎓 Student Login</h2>

    <p>
      Submit and track your hostel complaints.
    </p>

    <button type="button" onclick="studentLogin()">
      Continue as Student →
    </button>
  </div>

  <div class="card">
    <h2>🛡️ Warden Login</h2>

    <p>
      Manage and monitor hostel complaints.
    </p>

    <button type="button" onclick="showWardenLogin()">
      Continue as Warden →
    </button>

    <div id="wardenBox">

      <input
        type="password"
        id="wardenPassword"
        placeholder="Enter Warden Password"
        autocomplete="current-password"
        onkeydown="if(event.key === 'Enter') wardenLogin()"
      >

      <button type="button" onclick="wardenLogin()">
        Login →
      </button>

      <p id="message" role="alert"></p>

    </div>
  </div>

  <footer>
    HostelCare © 2026 | Made for Hostel Students
  </footer>

</div>

<script>
  function studentLogin() {
    window.location.href = "student.html";
  }

  function showWardenLogin() {
    document.getElementById("wardenBox").style.display = "block";
    document.getElementById("wardenPassword").focus();
  }

  function wardenLogin() {
    const password =
      document.getElementById("wardenPassword").value;

    if (password === "Hostel@123") {
      window.location.href = "warden.html";
    } else {
      document.getElementById("message").textContent =
        "Incorrect password. Try again!";
    }
  }
</script>

</body>
</html>
